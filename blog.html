<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blog - WollyDev24</title>
  <meta name="description" content="Blog posts by WollyDev24." />
  <link rel="stylesheet" href="material.css" />
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="index">
      <span class="icon-box" style="width:32px;height:32px;border-radius:10px;"><span class="msr md filled" aria-hidden="true">&#xE65F;</span></span>
      <span class="brand-txt">WollyDev24</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="index">Main</a>
      <a class="nav-link" href="blog" aria-current="page">Blog</a>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle appearance"><span class="msr md" aria-hidden="true"></span></button>
    </div>
  </nav>

  <main class="wrap">
    <section class="section-head">
      <span class="kicker">Blog</span>
      <h2>Latest posts</h2>
      <p>Notes, updates and releases.</p>
    </section>

    <div class="list" id="blog-list">
      <div class="center-row"><span class="chip">Loading posts&hellip;</span></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="https://github.com/wollydev24" target="_blank">GitHub</a>
      <a href="https://t.me/wollydev24" target="_blank">Telegram</a>
      <a href="https://wolly.is-a.dev" target="_blank">Links</a>
    </div>
    <span>&copy; 2026 WollyDev24</span>
  </footer>

  <script>
    function toggleBlog(row) {
      var expand = row.nextElementSibling;
      var wasOpen = expand.classList.contains('open');
      var opens = document.querySelectorAll('.list-row.open');
      for (var i = 0; i < opens.length; i++) {
        if (opens[i] !== row) {
          opens[i].classList.remove('open');
          opens[i].nextElementSibling.classList.remove('open');
        }
      }
      if (wasOpen) {
        row.classList.remove('open');
        expand.classList.remove('open');
      } else {
        row.classList.add('open');
        expand.classList.add('open');
      }
    }

    var req = new XMLHttpRequest();
    req.open('GET', 'data/blog.json', true);
    req.onload = function() {
      var list = document.getElementById('blog-list');
      if (req.status !== 200) {
        list.innerHTML = '<div class="center-row"><span class="chip">Failed to load posts.</span></div>';
        return;
      }
      var posts = JSON.parse(req.responseText);
      if (posts.length === 0) {
        list.innerHTML = '<div class="center-row"><span class="chip">No posts yet.</span></div>';
        return;
      }
      var html = '';
      for (var i = 0; i < posts.length; i++) {
        var p = posts[i];
        var imgs = '';
        if (p.images) {
          for (var j = 0; j < p.images.length; j++) {
            imgs += '<img src="' + p.images[j] + '" alt="" loading="lazy">';
          }
        }
        html += '<div class="list-row" onclick="toggleBlog(this)">' +
          '<span class="list-icon icon-box"><span class="msr lg filled" aria-hidden="true">&#xE873;</span></span>' +
          '<span class="list-body"><span class="list-title">' + p.title + '</span>' +
          '<span class="list-desc">' + (p.excerpt || p.date) + '</span></span>' +
          '<span class="list-arrow msr md expand-arrow" aria-hidden="true">&#xE5CF;</span></div>' +
          '<div class="expand"><div class="expand-inner">' + p.content + imgs + '</div></div>';
      }
      list.innerHTML = html;
    };
    req.onerror = function() {
      document.getElementById('blog-list').innerHTML = '<div class="center-row"><span class="chip">Failed to load posts.</span></div>';
    };
    req.send();
  </script>

  <script src="material.js"></script>
</body>
</html>
