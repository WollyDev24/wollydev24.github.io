<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WollyDev – Mini App</title>
  <meta name="description" content="WollyDev – GitHub profile mini app." />
  <link rel="stylesheet" href="material.css" />
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="/">
      <span class="icon-box" style="width:32px;height:32px;border-radius:10px;"><span class="msr md filled" aria-hidden="true">&#xE65F;</span></span>
      <span class="brand-txt">WollyDev</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="/">Main</a>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle appearance"><span class="msr md" aria-hidden="true"></span></button>
    </div>
  </nav>

  <main class="wrap">
    <section class="hero center reveal" style="padding-top:48px;">
      <div class="icon-box big" style="margin:0 auto;">
        <span class="msr filled" aria-hidden="true">&#xEB8E;</span>
      </div>
      <h2>Hi, I&rsquo;m <span style="color:var(--primary)">WollyDev</span></h2>
      <p>Welcome to my GitHub profile.</p>
      <div class="hero-actions">
        <a class="btn primary" href="https://github.com/wollydev24" target="_blank" rel="noopener"><span class="msr sm" aria-hidden="true">&#xE86F;</span> Visit My GitHub</a>
        <a class="btn" href="https://discord.gg/bapB8zz7VY" target="_blank" rel="noopener"><span class="msr sm" aria-hidden="true">&#xE0C9;</span> Join My Discord</a>
        <a class="btn" href="https://t.me/YouShadeKWGT" target="_blank" rel="noopener"><span class="msr sm" aria-hidden="true">&#xE163;</span> Follow on Telegram</a>
      </div>
    </section>

    <div class="list" id="giveaway-section">
      <div class="panel">
        <div class="panel-header">
          <span class="icon-box"><span class="msr md filled" aria-hidden="true">&#xE8F6;</span></span>
          <span class="list-body"><span class="list-title">Giveaways</span></span>
        </div>
        <div class="center-row"><span class="chip">Loading giveaways&hellip;</span></div>
      </div>
    </div>

    <div class="list" id="projects-section">
      <div class="panel">
        <div class="panel-header">
          <span class="icon-box"><span class="msr md filled" aria-hidden="true">&#xE617;</span></span>
          <span class="list-body"><span class="list-title">My Projects</span></span>
        </div>
        <div class="center-row"><span class="chip">Loading projects&hellip;</span></div>
      </div>
    </div>

    <div class="list" id="devices-section">
      <div class="panel">
        <div class="panel-header">
          <span class="icon-box"><span class="msr md filled" aria-hidden="true">&#xE326;</span></span>
          <span class="list-body"><span class="list-title">My Devices</span></span>
        </div>
        <div class="center-row"><span class="chip">Loading devices&hellip;</span></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="https://github.com/wollydev24" target="_blank">GitHub</a>
      <a href="https://discord.gg/bapB8zz7VY" target="_blank">Discord</a>
      <a href="https://t.me/YouShadeKWGT" target="_blank">Telegram</a>
    </div>
    <span>&copy; 2026 WollyDev</span>
  </footer>

  <script>
    function itemHtml(icon, url, name, desc) {
      var anchor = url ? '<a class="list-row clickable" href="' + url + '" target="_blank" rel="noopener">' :
        '<div class="list-row">';
      var close = url ? '</a>' : '</div>';
      return anchor +
        '<span class="list-icon icon-box"><span class="msr md" aria-hidden="true">' + icon + '</span></span>' +
        '<span class="list-body"><span class="list-title">' + name + '</span>' +
        '<span class="list-desc">' + desc + '</span></span></div>' + close;
    }

    function fill(sectionId, items, icon, empty) {
      var section = document.getElementById(sectionId);
      var panel = section.querySelector('.panel');
      var existing = section.querySelectorAll('.list-row, .center-row');
      for (var i = 0; i < existing.length; i++) existing[i].parentNode.removeChild(existing[i]);
      if (items && items.length) {
        for (var j = 0; j < items.length; j++) {
          var it = items[j];
          var div = document.createElement('div');
          div.innerHTML = itemHtml(icon, it.url, it.name, it.description || '');
          panel.appendChild(div.firstChild);
        }
      } else {
        var d = document.createElement('div');
        d.className = 'center-row';
        d.innerHTML = '<span class="chip">' + empty + '</span>';
        panel.appendChild(d);
      }
    }

    function fail(sectionId) {
      var section = document.getElementById(sectionId);
      var panel = section.querySelector('.panel');
      var existing = section.querySelectorAll('.list-row, .center-row');
      for (var i = 0; i < existing.length; i++) existing[i].parentNode.removeChild(existing[i]);
      var d = document.createElement('div');
      d.className = 'center-row';
      d.innerHTML = '<span class="chip">Could not load.</span>';
      panel.appendChild(d);
    }

    fetch("https://wollydev24.github.io/data/giveaway.json?nocache=" + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        fill('giveaway-section', data.active && data.items ? data.items : [], '&#xE8F6;', 'No giveaways running');
      })
      .catch(function() { fail('giveaway-section'); });

    fetch("https://wollydev24.github.io/data/projects.json?nocache=" + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        fill('projects-section', data.projects || [], '&#xE617;', 'No projects found');
      })
      .catch(function() { fail('projects-section'); });

    fetch("https://wollydev24.github.io/data/devices.json?nocache=" + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        fill('devices-section', data.devices || [], '&#xE326;', 'No devices listed');
      })
      .catch(function() { fail('devices-section'); });
  </script>

  <script src="material.js"></script>
</body>
</html>
