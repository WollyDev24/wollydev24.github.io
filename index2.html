<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WollyDev 3D Card</title>
  <meta name="description" content="WollyDev – the flip card." />
  <link rel="stylesheet" href="material.css" />
  <style>
    .card-container {
      width: 600px;
      height: 340px;
      perspective: 1200px;
      margin: 24px auto;
    }
    .flip-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .8s cubic-bezier(.22, 1, .36, 1);
    }
    .flip-card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      box-shadow: 0 18px 44px var(--elevation-shadow);
      overflow: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
    }
    .card-face.back { transform: rotateY(180deg); }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--outline-variant);
      margin-bottom: 14px;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .flip-card h1 { font-size: 1.5rem; }
    .subtitle { color: var(--on-surface-variant); font-size: .9rem; margin-top: 2px; }
    .card-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
    .back-content { gap: 10px; }
    .back-content h2 { font-size: 1.2rem; }
    .back-content .chip { margin-top: 4px; }
    .flip-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 8px auto 0;
      padding: 14px 26px;
      border-radius: 999px;
      border: 1px solid var(--outline-variant);
      background: var(--surface-container-high);
      color: var(--on-surface);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform .2s cubic-bezier(.22, 1, .36, 1), background .2s;
    }
    .flip-btn:hover { background: var(--surface-container-highest); transform: translateY(-2px); }
    @media (max-width: 640px) {
      .card-container { width: 340px; height: 400px; }
    }
    @media (max-width: 380px) {
      .card-container { width: 290px; height: 420px; }
      .card-actions { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="/">
      <span class="icon-box" style="width:32px;height:32px;border-radius:10px;"><span class="msr md filled" aria-hidden="true">&#xE65F;</span></span>
      <span class="brand-txt">WollyDev</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="/">Main</a>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle appearance"><span class="msr md" aria-hidden="true"></span></button>
    </div>
  </nav>

  <main class="center-page">
    <div class="card-container">
      <div class="flip-card" id="card">
        <div class="card-face">
          <div class="avatar">
            <img src="https://avatars.githubusercontent.com/u/170989885?v=4" alt="WollyDev avatar" />
          </div>
          <h1>WollyDev</h1>
          <span class="chip accent" style="margin-top:10px;">Active</span>
          <p class="subtitle">Android Fan &middot; Developer &middot; Tech Enthusiast</p>
          <div class="card-actions">
            <a class="btn secondary sm" href="https://github.com/wollydev24" target="_blank" rel="noopener"><span class="msr sm" aria-hidden="true">&#xF09A;</span> GitHub</a>
            <a class="btn secondary sm" href="https://discord.gg/bapB8zz7VY" target="_blank" rel="noopener"><span class="msr sm" aria-hidden="true">&#xE0C9;</span> Discord</a>
            <a class="btn secondary sm" href="https://t.me/YouShadeKWGT" target="_blank" rel="noopener"><span class="msr sm" aria-hidden="true">&#xE163;</span> Telegram</a>
          </div>
          <p class="subtitle" style="margin-top:14px;">&ldquo;Creating projects, sharing giveaways, and having fun.&rdquo;</p>
        </div>
        <div class="card-face back">
          <div class="back-content">
            <h2>Projects &amp; info</h2>
            <span class="chip">Check out my website</span>
            <a class="btn primary sm" href="https://wollydev24.github.io" target="_blank" rel="noopener"><span class="msr sm" aria-hidden="true">&#xE65F;</span> wollydev24.github.io</a>
            <span class="chip">devices.json &middot; projects.json &middot; giveaway.json</span>
            <span class="subtitle">Flip back to profile</span>
          </div>
        </div>
      </div>
    </div>

    <button class="flip-btn" id="flipBtn">
      <span class="msr md" aria-hidden="true">&#xE5D5;</span> Flip Card
    </button>
  </main>

  <script>
    var card = document.getElementById('card');
    var flipBtn = document.getElementById('flipBtn');

    flipBtn.addEventListener('click', function() {
      card.classList.toggle('flipped');
    });

    card.addEventListener('mousemove', function(e) {
      var rect = card.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var rx = ((y - rect.height / 2) / rect.height) * 15;
      var ry = ((x - rect.width / 2) / rect.width) * 15;
      var flipped = card.classList.contains('flipped');
      card.style.transform = 'rotateY(' + (flipped ? 180 : 0) + 'deg) rotateX(' + (-rx) + 'deg) rotateY(' + ry + 'deg)';
    });

    card.addEventListener('mouseleave', function() {
      card.style.transform = card.classList.contains('flipped') ? 'rotateY(180deg)' : 'rotateY(0deg)';
    });
  </script>

  <script src="material.js"></script>
</body>
</html>
